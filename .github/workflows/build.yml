name: Build APK

on:
  push:
    paths:
      - project.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q project.zip -d work

      - name: Add permanent signing key
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > work/release.keystore
            echo "Signing with your permanent key"
          else
            echo "WARNING: secret KS_B64 not found. Using a temporary key, so this APK cannot update the installed app."
          fi

      - name: Build APK
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/app/build/outputs/apk/debug/app-debug.apk SensiHelper.apk
          if [ -f release-notes.txt ]; then
            cp release-notes.txt notes.txt
          else
            echo "A new version of Sensi Helper is ready. Tap to download." > notes.txt
          fi
          gh release create "build-${{ github.run_number }}" SensiHelper.apk \
            --repo "${{ github.repository }}" \
            --title "Sensi Helper build ${{ github.run_number }}" \
            --notes-file notes.txt
