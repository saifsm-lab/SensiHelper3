name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q project.zip -d work
      - name: Build APK
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/app/build/outputs/apk/debug/app-debug.apk SensiHelper.apk
          gh release create "build-${{ github.run_number }}" SensiHelper.apk \
            --repo "${{ github.repository }}" \
            --title "Sensi Helper build ${{ github.run_number }}" \
            --notes "Debug APK. Download SensiHelper.apk"
